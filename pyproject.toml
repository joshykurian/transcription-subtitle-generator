[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-subtitle-generator"
version = "1.2.0"
description = "Transcribe audio/video and generate SRT, VTT, TXT and word timestamps with faster-whisper, with optional FFmpeg subtitle burning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Joshy Kurian"}]
dependencies = [
  "faster-whisper>=1.2.1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transcribe-subtitles = "transcription_subtitle_generator.cli:main"
video-subtitles = "transcription_subtitle_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
